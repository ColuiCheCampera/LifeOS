name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://build:build@localhost/build
      AUTH_URL: https://build.example.test
      AUTH_SECRET: ci-build-only-secret-with-at-least-32-characters
      AUTH_GOOGLE_ID: ci-build
      AUTH_GOOGLE_SECRET: ci-build
      ALLOWED_GOOGLE_SUB: ci-build
      ALLOWED_EMAIL: ci@example.test
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run audit:scopes
      - run: npm run audit:bundle
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-evidence
          path: |
            playwright-report
            test-results
